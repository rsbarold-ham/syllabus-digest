<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password -- Syllabus Digest</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-shell">
        <h1 class="auth-title">Syllabus Digest</h1>
        <div class="card auth-card">
            <h2>Choose a new password</h2>
            {% if error %}<div class="banner banner-warn">{{ error }}</div>{% endif %}
            <form method="post" action="/reset-password/{{ token }}" class="stack">
                <div class="field">
                    <label for="new_password">New password (min. 8 characters)</label>
                    <input id="new_password" type="password" name="new_password" minlength="8" required autofocus>
                </div>
                <div class="field">
                    <label for="confirm_password">Confirm new password</label>
                    <input id="confirm_password" type="password" name="confirm_password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary">Reset password</button>
            </form>
        </div>
    </div>
</body>
</html>
