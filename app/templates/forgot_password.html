<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password -- Syllabus Digest</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-shell">
        <h1 class="auth-title">Syllabus Digest</h1>
        <div class="card auth-card">
            <h2>Forgot your password?</h2>
            <p class="hint">
                Enter the email you signed up with. If your account has a sending email
                already set up, we'll email you a reset link through it -- the same way
                your daily digest gets sent, just to you instead.
            </p>
            {% if message %}<div class="banner banner-info">{{ message }}</div>{% endif %}
            <form method="post" action="/forgot-password" class="stack">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary">Send reset link</button>
            </form>
            <p class="auth-switch"><a href="/login">Back to log in</a></p>
        </div>
    </div>
</body>
</html>
