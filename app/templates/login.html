<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in -- Syllabus Digest</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-shell">
        <h1 class="auth-title">Syllabus Digest</h1>
        <div class="card auth-card">
            <h2>Log in</h2>
            {% if error %}<div class="banner banner-warn">{{ error }}</div>{% endif %}
            <form method="post" action="/login" class="stack">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Log in</button>
            </form>
            <p class="auth-switch"><a href="/forgot-password">Forgot your password?</a></p>
            <p class="auth-switch">No account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
</body>
</html>
